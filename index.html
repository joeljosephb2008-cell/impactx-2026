<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A6E6E">
  <meta name="description" content="ReturnEase: returns and refunds explained. IMPACTX 2026 prototype with sample data.">
  <title>ReturnEase</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A6E6E'/><path d='M10 14l-4 4 4 4M6 18h14a6 6 0 000-12h-4' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <p id="banner" class="banner" role="note">Prototype with sample data. No real orders, pickups or payments.</p>
  <header class="top">
    <a href="#/" class="brand" aria-label="ReturnEase home">
      <span class="logo" aria-hidden="true">↩</span>
      <span><strong>ReturnEase</strong><span id="tagline" class="small">Returns and refunds, explained</span></span>
    </a>
    <div class="row gap">
      <button class="icon-btn" data-read aria-label="Read this page aloud">🔊</button>
      <button class="icon-btn" data-settings aria-label="Display and language">Aa</button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-page="home"><span aria-hidden="true">⌂</span><span data-t="navHome">Home</span></a>
    <a href="#/returns" data-page="returns"><span aria-hidden="true">↩</span><span data-t="navReturns">Returns</span></a>
    <a href="#/help" data-page="help"><span aria-hidden="true">?</span><span data-t="navHelp">Help</span></a>
  </nav>

  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title" data-t="settings">Display and language</h2>
    <label class="field"><span data-t="language">Language</span>
      <select id="set-lang" data-lang>
        <option value="en">English</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="te">తెలుగు (Telugu)</option>
      </select></label>
    <label class="field"><span data-t="textSize">Text size</span>
      <input id="set-size" data-size type="range" min="0" max="3" step="1"></label>
    <label class="radio"><input id="set-contrast" type="checkbox" data-contrast> <span data-t="contrast">High contrast</span></label>
    <label class="radio"><input id="set-lowdata" type="checkbox" data-lowdata> <span data-t="lowData">Low data mode</span></label>
    <button class="btn ghost block" data-read>🔊 Read this page aloud</button>
    <button class="btn ghost block" data-reset><span data-t="resetDemo">Reset demo data</span></button>
    <button class="btn primary block" data-close>Done</button>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
